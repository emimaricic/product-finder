name: product-finder

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finder
      POSTGRES_PASSWORD: finder
      POSTGRES_DB: product_finder
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U finder -d product_finder']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://finder:finder@postgres:5432/product_finder?schema=public
      TRUST_PROXY: 1
      CATALOGUE_CSV_PATH: /app/data/products.csv
      SEED_ON_START: 'true'
    volumes:
      # The PIM export lives outside the image: replace the file + restart = new import.
      - ./data:/app/data:ro
    # Not published: nginx (web) is the only way in, so the X-Forwarded-For it
    # sets is the only one TRUST_PROXY ever sees (no rate-limit spoofing).
    expose:
      - '3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./frontend
      args:
        # Optional: your own PrimeUI key; empty → committed Community fallback.
        PRIMEUI_LICENSE_KEY: ${PRIMEUI_LICENSE_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '8080:80'

volumes:
  pgdata:
