server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Same-origin API: browser talks to /api, nginx forwards to the backend.
  # No CORS, and shared links work identically in dev (ng proxy) and Docker.
  # ^~ wins over the static-asset regex below, so Swagger's /api/docs/*.js|css proxy too.
  location ^~ /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed bundles can be cached forever.
  location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: deep links like /products/P-10001?x=y must load the app.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
